{% extends "layout.html" %}
{% block content %}

<div class="dashboard-container">

  <div class="character-panel">

    <h2>{{ character['name'] }}</h2>

    <img src="{{ url_for('dashboard.character_image',
                         char_id=character['id']) }}"
         alt="{{ character['name'] }}">

    <form class="add-page-card"
          action="{{ url_for('dashboard.regenerate_character',
                             char_id=character['id']) }}"
          method="POST" enctype="multipart/form-data"
          style="width:340px;">
      <h3 style="margin-top:0; text-align:center;">Regeneruj obraz</h3>

      <input type="hidden" name="prompt" value="{{ prompt }}">

      <label for="image">Nowy obraz bazowy (opcjonalnie):</label><br>
      <input type="file" id="image" name="image" accept="image/*"
             style="width:100%; margin-bottom:18px;">

      <button type="submit" style="width:100%;">Regeneruj</button>
    </form>

    <a class="dash-btn back-btn"
       href="{{ url_for('dashboard.view_characters') }}">
       ← Wróć do listy
    </a>

  </div>

</div>

{% endblock %}
