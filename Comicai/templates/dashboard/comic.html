{% extends "layout.html" %}
{% block content %}

<h2 style="text-align:center; margin-top:24px;">{{ comic['title'] }}</h2>

<div class="comic-wrapper">

  <!-- ███  Grid  ███ -->
  <div class="page-grid">
    {% for p in pages %}
      <div class="page-item">
        <h4>Strona {{ p['page_number'] }}</h4>
        <img src="{{ url_for('dashboard.comic_page_image', page_id=p['id']) }}"
             alt="Strona {{ p['page_number'] }}">
      </div>
    {% else %}
      <p>Brak stron w tym komiksie.</p>
    {% endfor %}
  </div>

  <!-- ███  Sticky side panel  ███ -->
  <div class="side-panel">

    <form class="add-page-card"
          action="{{ url_for('dashboard.add_page', comic_id=comic['id']) }}"
          method="POST" enctype="multipart/form-data">
      <h3 style="margin-top:0; text-align:center;">Dodaj stronę</h3>

      <label for="desc">Opis / prompt:</label><br>
      <textarea id="desc" name="description" rows="4" required></textarea><br>

      <label for="image">Obraz bazowy (opcjonalnie):</label><br>
      <input type="file" id="image" name="image" accept="image/*"><br>

      <button type="submit">Generuj stronę</button>
    </form>

    <a class="back-button"
       href="{{ url_for('dashboard.view_comics') }}">
       ← Wróć do listy
    </a>

  </div>

</div>

{% endblock %}
