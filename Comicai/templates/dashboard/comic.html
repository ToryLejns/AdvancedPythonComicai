{% extends "layout.html" %}
{% block content %}

<h2 style="text-align:center; margin-top:24px;">{{ comic['name'] }}</h2>

<div class="comic-wrapper">

  <!-- ░░░  Grid with pages  ░░░ -->
  <div class="page-grid">
    {% for p in pages %}
      <div class="page-item">
        <h4 style="text-align:center; margin:8px 0;">
          Strona {{ p['page_number'] }}
        </h4>
        <img src="{{ url_for('dashboard.comic_page_image',
                             page_id=p['id']) }}"
             alt="Strona {{ p['page_number'] }}">
      </div>
    {% else %}
      <p style="color:#fff; text-align:center;">Brak stron w tym komiksie.</p>
    {% endfor %}
  </div>

  <!-- ░░░  Sticky sidebar  ░░░ -->
  <div class="side-panel">

    <!-- Add-page card (unchanged) -->
    <form class="add-page-card"
          action="{{ url_for('dashboard.add_page', comic_id=comic['id']) }}"
          method="POST" enctype="multipart/form-data">
      <h3 style="margin-top:0; text-align:center;">Dodaj stronę</h3>

      <label for="desc">Opis / prompt:</label><br>
      <textarea id="desc" name="description" rows="4" required></textarea><br>

      <label for="image">Obraz bazowy (opcjonalnie):</label><br>
      <input type="file" id="image" name="image" accept="image/*"><br>

      <button type="submit" class="dash-btn" style="width:100%;">
        Generuj stronę
      </button>
    </form>

    <!-- NEW  regenerate-last-page button -->
    <form action="{{ url_for('dashboard.regenerate_last',
                             comic_id=comic['id']) }}"
          method="POST">
      <button class="dash-btn" style="width:100%;">
        Regeneruj ostatnią stronę
      </button>
    </form>

    <!-- Back to list -->
    <a class="dash-btn back-btn"
       href="{{ url_for('dashboard.view_comics') }}">
       ← Wróć do listy
    </a>
  </div>

</div>

{% endblock %}
