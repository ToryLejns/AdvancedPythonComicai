{% extends "layout.html" %}
{% block content %}

<div class="dashboard-container">

  <h2 style="text-align:center; margin-top:24px;">Twoje postacie</h2>

  <div class="dashboard-panel">
    {% for c in characters %}
      <a class="dash-btn"
         href="{{ url_for('dashboard.character_detail', char_id=c['id']) }}">
        {{ c['name'] }}
      </a>
    {% else %}
      <p style="color:#fff; text-align:center; width:100%;">
        Brak postaci.
      </p>
    {% endfor %}
  </div>

</div>

{% endblock %}
