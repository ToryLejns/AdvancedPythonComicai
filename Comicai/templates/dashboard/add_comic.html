{% extends 'layout.html' %}
{% block content %}
<h2>Dodaj komiks</h2>

<form method="POST" enctype="multipart/form-data">
  <label for="title">Tytuł:</label>
  <input type="text" id="title" name="title" required>

  <label for="description">Opis / prompt:</label>
  <textarea id="description" name="description" rows="4"></textarea>

  <label for="characters">Wybierz postacie (Ctrl/⌘ + klik dla wielu):</label>
  <select id="characters" name="characters" multiple size="5">
    {% for c in characters %}
      <option value="{{ c['id'] }}">{{ c['title'] }}</option>
    {% endfor %}
  </select>

  <label for="image">Obraz bazowy (opcjonalnie):</label>
  <input type="file" id="image" name="image" accept="image/*">

  <button type="submit">Dodaj</button>
</form>
{% endblock %}
