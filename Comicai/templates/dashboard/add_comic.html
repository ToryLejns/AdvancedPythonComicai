{% extends "layout.html" %}
{% block content %}

<h2 style="text-align:center; margin-top:24px;">Dodaj komiks</h2>

<div style="display:flex; justify-content:center; margin-top:32px;">
  <form class="add-page-card"
        method="POST" enctype="multipart/form-data"
        style="width:340px;">

    <label for="title">Tytuł:</label><br>
    <input type="text" id="title" name="title"
           required style="width:100%; margin-bottom:12px;">

    <label for="description">Opis / prompt:</label><br>
    <textarea id="description" name="description" rows="4" required
              style="margin-bottom:12px;"></textarea>

    <label for="characters">Wybierz postacie:</label><br>
    <select id="characters" name="characters" multiple size="5"
            style="margin-bottom:12px;">
      {% for c in characters %}
        <option value="{{ c['id'] }}">{{ c['name'] }}</option>
      {% endfor %}
    </select>

    <label for="image">Obraz bazowy (opcjonalnie):</label><br>
    <input type="file" id="image" name="image" accept="image/*"
           style="width:100%; margin-bottom:18px;">

    <button type="submit" style="width:100%;">Generuj komiks</button>
  </form>
</div>

{% endblock %}
