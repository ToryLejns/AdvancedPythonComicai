{% extends "layout.html" %}
{% block content %}

<h2 style="text-align:center; margin-top:24px;">Dodaj postać</h2>

<div style="display:flex; justify-content:center; margin-top:32px;">
  <form class="add-page-card"
        method="POST" enctype="multipart/form-data"
        style="width:340px;">
      <label for="name">Nazwa postaci:</label><br>
      <input type="text" id="name" name="name" required style="width:100%; margin-bottom:12px;">

      <label for="description">Opis / prompt:</label><br>
      <textarea id="description" name="description" rows="4" required style="width:100%; margin-bottom:12px;"></textarea>

      <label for="image">Obraz bazowy (opcjonalnie):</label><br>
      <input type="file" id="image" name="image" accept="image/*" style="width:100%; margin-bottom:18px;">

      <button type="submit" style="width:100%;">Generuj postać</button>
  </form>
</div>

{% endblock %}
